[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stump-press"
version = "0.1.0"
description = "Hunt historic US newspaper scans with garbage OCR and invent stump-the-AI questions from the page image."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Charles Miedema" }]
keywords = ["ocr", "newspapers", "chronicling-america", "loc", "stump-ai"]
dependencies = [
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
stump = "stump_press.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stump_press = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
